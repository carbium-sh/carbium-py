name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install --no-cache-dir "pytest==9.2.0" .
      - run: python -m pytest -q -p no:cacheprovider tests
      - run: python -m pip install --no-cache-dir ".[stream]" "grpcio-tools==1.85.3"
      - run: python -m pytest -q -p no:cacheprovider tests/test_stream.py tests/test_stream_extra.py
