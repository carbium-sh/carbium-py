# Publishes carbium to PyPI when a GitHub release tagged v<version> is published, for example v0.1.0, through trusted
# publishing (OIDC, no token anywhere). On pypi.org the project's trusted publisher (a pending one before the first
# upload) names this repository, this workflow file and environment pypi, so only the pypi job, the one job in that
# environment, can get an upload token. Build and tests run in a job with no write token, on the built wheel; a tag
# that is not v and pyproject.toml's version, or a release ticked as a pre-release with a final version, stops there.
# The upload takes that job's files as they were built, and a version already on PyPI is not uploaded again.
name: publish
on:
  release:
    types: [published]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          ver="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$ver" || { echo "tag $TAG does not match pyproject.toml's version $ver"; exit 1; }
          # PyPI reads a pre-release from the version alone, so a release ticked as one needs a1, b1, rc1 or .dev1 in it
          if [ "$PRERELEASE" = true ] && ! printf '%s' "$ver" | grep -Eq '(a|b|rc|[.]dev)[0-9]+$'; then
            echo "release $TAG is ticked as a pre-release, but $ver is a final version"; exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
      - run: scripts/leak-check.sh HEAD
      - run: python -m pip install --no-cache-dir "build==1.3.0" "twine==7.0.0" "pytest==9.2.0"
      - run: python -m build && python -m twine check --strict dist/*
      - run: |
          python -m pip install --no-cache-dir "dist/carbium-$VER-py3-none-any.whl"
          test "$(python -c 'import carbium; print(carbium.__version__)')" = "$VER"
          python -m pytest -q -p no:cacheprovider tests
      - run: |
          python -m pip install --no-cache-dir "dist/carbium-$VER-py3-none-any.whl[stream]" "grpcio-tools==1.85.3"
          python -m pytest -q -p no:cacheprovider tests/test_stream.py tests/test_stream_extra.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
